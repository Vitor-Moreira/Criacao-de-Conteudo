name: Poll scrape jobs

# Substitui o cron nativo da Vercel (indisponível com frequência < 1x/dia no plano Hobby).
# Chama o endpoint protegido por CRON_SECRET a cada 5 minutos para verificar
# o status dos runs de scraping da Apify e ingerir os resultados prontos.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar endpoint de polling
        run: |
          status=$(curl -s -o /tmp/response.txt -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ vars.CRON_TARGET_URL }}/api/cron/poll-scrape-jobs")
          echo "HTTP status: $status"
          cat /tmp/response.txt
          if [ "$status" -ge 400 ]; then
            exit 1
          fi
